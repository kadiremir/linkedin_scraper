countries:
#  - Austria
  - Czechia

job_titles:
#  - IT Consultant
  - DevOps Engineer
  - Software Engineer
  - Python Engineer
  - Python Developer

# Optional. Remove or leave commented to keep searching until LinkedIn stops returning jobs.
# max_pages: 2

# Optional. false keeps reposted jobs; true skips cards labeled "Reposted".
filter_reposted: true

# Options: last_24_hours, last_7_days, last_month
posted_within: last_24_hours

# false opens Chrome visibly; true runs without a browser window after you are already logged in.
headless: true

# Optional. Jobs whose title contains any of these words (case-insensitive) are skipped.
exclude_title_words:
   - Intern
#   - Lead
#   - Manager

# Optional. Jobs from companies whose name contains any of these strings (case-insensitive) are skipped.
exclude_company_names:
   - Pure Storage
#   - Recruiting

# Optional. Path to a YAML file listing jobs you've applied to (excluded from results).
# Defaults to applied_jobs.yaml in the current directory. Missing file is silently ignored.
# Only uncomment this line if you want to use a different file path.
# applied_jobs_file: applied_jobs.yaml
